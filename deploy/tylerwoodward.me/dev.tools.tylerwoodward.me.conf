# dev.tools.tylerwoodward.me: redirect only. The dev copy of the toolkit was
# retired; every path 301s to the same path on tools.tylerwoodward.me. Keeps its
# certificate so HTTPS requests redirect cleanly. Install by hand (needs sudo):
#   sudo install -m 644 deploy/tylerwoodward.me/dev.tools.tylerwoodward.me.conf \
#     /etc/nginx/sites-available/dev.tools.tylerwoodward.me && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dev.tools.tylerwoodward.me;

    location / {
        return 301 https://tools.tylerwoodward.me$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.tools.tylerwoodward.me;

    ssl_certificate /etc/letsencrypt/live/dev.tools.tylerwoodward.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.tools.tylerwoodward.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/twp-headers-tools-astro.conf;

    location / {
        return 301 https://tools.tylerwoodward.me$request_uri;
    }
}
