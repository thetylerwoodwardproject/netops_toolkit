# dev.tools.tylerwoodward.me: the Astro NetOps Toolkit's dev checkout.
# Installed by deploy/tylerwoodward.me/install-vhost.sh.

server {
    listen 80;
    listen [::]:80;
    server_name dev.tools.tylerwoodward.me;

    # certbot renewals over HTTP-01.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://dev.tools.tylerwoodward.me$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.tools.tylerwoodward.me;

    ssl_certificate /etc/letsencrypt/live/dev.tools.tylerwoodward.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.tools.tylerwoodward.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dev.tools.tylerwoodward.me/dist;
    index index.html;
    charset utf-8;

    # add_header is not inherited into a location that declares its own, so
    # every location below that sets a header includes this again.
    include snippets/twp-headers-tools-astro.conf;

    # Deny rules stay above any regex location: nginx stops at the first match.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    include snippets/twp-deny-private.conf;

    # Fingerprinted by the build.
    location ^~ /_astro/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/twp-headers-tools-astro.conf;
    }

    # The old site's standalone IP checker lived at /ip/.
    location ~ ^/ip/?$ {
        return 301 /ip-checker/;
    }

    error_page 404 /404.html;

    # Pages and the small unversioned files (theme.css, favicon.svg, search.json).
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include snippets/twp-headers-tools-astro.conf;
    }
}
