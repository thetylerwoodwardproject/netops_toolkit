# Security headers for the Astro NetOps Toolkit (dev.tools.tylerwoodward.me,
# and tools.tylerwoodward.me after cutover). Installed to
# /etc/nginx/snippets/twp-headers-tools-astro.conf by install-vhost.sh.
#
# Include at server level AND in every location that declares an add_header
# of its own; see twp-headers-base.conf for why.
#
# Replaces twp-headers-tools.conf, the old single-script site's policy, which
# needed 'unsafe-inline' for ~270 inline handlers and a Lucide CDN. The build
# has neither: tools/verify.mjs fails a release with any inline script, style
# block, style attribute or on*= handler.
#
#   connect-src  the IP Checker's lookups: api.ipify.org (+ v4/v6) for the
#                public IP, ipapi.co for geolocation, dns.google for DoH.
#   img-src      data: only; icons are inline SVG.

include snippets/twp-headers-base.conf;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://api.ipify.org https://api4.ipify.org https://api6.ipify.org https://ipapi.co https://dns.google" always;
